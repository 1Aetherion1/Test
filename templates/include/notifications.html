{% if form.non_field_errors %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="alert alert-danger alert-dismissible fade show custom-shadow"
                     role="alert">
                    {{ form.non_field_errors }}

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Закрыть"></button>
                </div>
            </div>
        </div>
    </div>
{% endif %}

{% if messages %}
    <div id="notification"
         class="position-fixed start-50 translate-middle-x z-3"
         style="top: 80px; width: 90%; max-width: 500px;">

        {% for message in messages %}
            <div class="alert {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR or message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-danger{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}alert-success{% else %}alert-info{% endif %} alert-dismissible fade show custom-shadow"
                 role="alert">
                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Закрыть"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}

<div id="jq-notification"
     class="position-fixed start-50 translate-middle-x z-3 alert alert-success alert-dismissible fade show custom-shadow"
     style="top: 80px; width: 90%; max-width: 500px; display: none;"
     role="alert">
</div>
